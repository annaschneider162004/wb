  <g transform="rotate(-16 150 240)">
    <path d="M150 194c26 0 42 14 42 32 0 10-6 17-6 24s6 12 6 22c0 20-18 34-42 34s-42-14-42-34c0-10 6-15 6-22s-6-14-6-24c0-18 16-32 42-32Z" fill="url(#gtWood)"/>
    <circle cx="150" cy="248" r="18" fill="#5c3413"/>
    <circle cx="150" cy="248" r="22" fill="none" stroke="#8f5a24" stroke-width="3"/>
    <rect x="140" y="276" width="20" height="8" rx="3" fill="#5c3413"/>
    <rect x="141" y="112" width="18" height="86" rx="4" fill="#5c3413"/>
    <rect x="136" y="96" width="28" height="20" rx="5" fill="#3f230d"/>
