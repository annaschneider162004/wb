  <path d="M150 152c28 0 42 16 46 42l8 52c2 10-6 18-16 18h-76c-10 0-18-8-16-18l8-52c4-26 18-42 46-42Z" fill="url(#gtShirt)"/>
  <path d="M118 200h64v10h-64z" fill="#fff" opacity=".25"/>

