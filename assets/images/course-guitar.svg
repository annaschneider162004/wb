  <path d="M104 172c-16 14-24 32-22 52 1 9 15 8 15-1 0-15 5-27 15-36l-8-15Z" fill="url(#gtSkin)"/>
  <path d="M196 172c18 12 28 28 30 46 1 9-13 11-15 2-3-14-10-25-22-33l7-15Z" fill="url(#gtSkin)"/>
  <circle cx="98" cy="230" r="13" fill="url(#gtSkin)"/>
  <circle cx="216" cy="222" r="13" fill="url(#gtSkin)"/>

