  <path d="M96 282c14-8 34-12 54-12s40 4 54 12c-14 8-34 12-54 12s-40-4-54-12Z" fill="#33599b"/>
  <ellipse cx="88" cy="286" rx="16" ry="12" fill="url(#gtSkin)"/>
  <ellipse cx="212" cy="286" rx="16" ry="12" fill="url(#gtSkin)"/>

