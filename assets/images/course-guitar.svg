  <ellipse cx="168" cy="100" rx="8" ry="9" fill="#fff"/>
  <circle cx="133" cy="102" r="5" fill="#1e120c"/>
  <circle cx="169" cy="102" r="5" fill="#1e120c"/>
  <circle cx="135" cy="99" r="2" fill="#fff"/>
  <circle cx="171" cy="99" r="2" fill="#fff"/>
  <path d="M123 86c4-4 12-5 16-2M160 84c4-3 12-2 16 2" stroke="#1e120c" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <path d="M138 118c6 10 18 10 24 0 0 14-24 14-24 0Z" fill="#4a2416"/>
