<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360" role="img" aria-label="Boy sitting cross-legged playing an acoustic guitar">
  <defs>
    <linearGradient id="gtBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8f2e4"/><stop offset="1" stop-color="#9fdcbc"/>
    </linearGradient>
    <linearGradient id="gtShirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb648"/><stop offset="1" stop-color="#f08a1d"/>
    </linearGradient>
    <radialGradient id="gtSkin" cx=".4" cy=".32" r=".8">
      <stop offset="0" stop-color="#a9714a"/><stop offset="1" stop-color="#7d4a2b"/>
    </radialGradient>
    <linearGradient id="gtWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c073"/><stop offset="1" stop-color="#c2853a"/>
    </linearGradient>
  </defs>

  <rect width="300" height="360" rx="26" fill="url(#gtBg)"/>
  <circle cx="236" cy="66" r="36" fill="#fff" opacity=".4"/>
  <text x="42" y="76" font-family="Georgia, serif" font-size="32" fill="#1e7d4f" opacity=".4">&#9835;</text>
  <text x="248" y="272" font-family="Georgia, serif" font-size="26" fill="#1e7d4f" opacity=".35">&#9834;</text>
  <ellipse cx="150" cy="332" rx="94" ry="16" fill="#14432c" opacity=".18"/>

